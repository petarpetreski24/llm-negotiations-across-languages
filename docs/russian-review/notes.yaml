# Translator's notes for the Russian reviewer, keyed by segment ID (see the spreadsheet's ID column).
# Shown in the "Flags and notes" column. "KEY" marks the items that matter most for the study.

scenario/roles.aldoria.name: "«Альдория» with ь (not «Алдория»). In official style the name after «Республика» stays undeclined: «Республики Альдория», «в Республике Альдория». Is that right here?"
scenario/roles.aldoria.name_gen: "Genitive form, used in «Вы — глава делегации Республики Альдория»."
scenario/roles.veskaria.name_gen: "Genitive form, used in «Вы — глава делегации Республики Вескария»."
scenario/issues.release: "«Попуск» is the hydrology term for water let out of a reservoir. Is it clear to a non-specialist? Alternative: «сброс воды»."
scenario/issues.compensation: "Changed from «фонд компенсаций» to the more usual «компенсационный фонд»."
scenario/issues.electricity: "«продаваемая» agrees with «доля»."
scenario/issues.communique: "The English label has no word for 'wording', so the Russian has none either."
scenario/issues.communique.0: "KEY. The five statement options must stay clearly different in strength: 0 recognizes rights (strongest for Veskaria) > 1 acknowledges historical use > 2 takes note of both positions; 3 is Aldoria's legal principle; 4 is no reference to the treaty."
scenario/issues.communique.1: "KEY. Russian UN texts often use «признаёт» for both 'recognizes' and 'acknowledges'. Here the two must differ, so the draft uses «констатирует» (states as a fact). Alternatives: «отмечает» (weaker, close to 'takes note'), «признаёт факт исторического водопользования» (keeps «признаёт»). Which reads as clearly weaker than option 0 and stronger than option 2?"
scenario/issues.communique.2: "KEY. Standard diplomatic formula."
scenario/issues.communique.3: "KEY. Wording of the 1997 UN Watercourses Convention (Art. 5) in its official Russian text."
scenario/issues.communique.4: "KEY."
prompts/system:L1: "The instructions address the agent with lower-case «вы» throughout. Should it be «Вы»?"
prompts/system:L12: "(ключ \"filling\") tells the agent which JSON key belongs to this issue. Text in straight quotes is code and stays in English."
prompts/system:L14: "The number of points is filled in automatically with the right ending: 1 балл, 3 балла, 25 баллов."
prompts/system:L17: "There is no standard Russian term for 'walk-away value', so the draft explains it: «— столько для неё стоит выход из переговоров без соглашения». Better wording welcome."
prompts/system:L23: "Text in straight quotes (\"decision\", \"accept\", \"accepted_terms\") is a JSON field name or value and must stay in English."
prompts/system:L26: "'under 150 words' → «короче 150 слов»."
prompts/system:L33: "The Russian adds short glosses in brackets after the three English values, so a Russian reader learns what the English words tell an English reader."
prompts/system:L35: "Deliberate difference: the Russian instructions ask for the private note in Russian (the instruction language); the English ones ask for English."
prompts/turn:L7: "'briefing book' → «справочные материалы»."
prompts/errors:not_json: "«он» refers to «ответ» in the retry sentence: «Ваш предыдущий ответ не может быть использован: он не является корректным JSON.»"
roles/aldoria:P1: "«Остра» is undeclined after «река» (реки Остра) and declined on its own (из Остры, на Остре). Is that natural?"
corpora/aldoria/01-dam-project:T: "Name of the dam, used in every document: «Большая плотина на Остре» ('Ostra Grand Dam'). Alternative: «Великая плотина на Остре»."
corpora/aldoria/05-legal-position:P1: "«Конвенция ООН по водотокам» is a short form of the 1997 Convention's Russian title. The legal terms follow its official Russian text."
personas/hawk:P1: "'hard-line negotiator' → «жёсткий переговорщик»."
personas/dove:P1: "'that both countries can defend at home' → «которое каждая из сторон сможет отстоять у себя в стране»; 'trade-offs' → «компромиссы»."
