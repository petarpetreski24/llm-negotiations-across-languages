[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "negmt"
version = "0.1.0"
description = "LLM negotiation across languages, with machine translation in the loop"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Russian materials review: spreadsheet export/import (python -m negmt.review)
review = ["openpyxl>=3.1"]
# local CPU translation (review back-translation; NLLB smoke test). Install PyTorch first:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
localmt = ["transformers>=4.40,<5", "sentencepiece>=0.2", "sacremoses>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
